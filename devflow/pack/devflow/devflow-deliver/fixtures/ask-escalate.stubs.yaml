# A thread the judge cannot settle (needs_human): act asks, and the escalate message
# gate is reached; its stub is the operator's answer. The message names the round's
# summary and report path through node outputs ( stays literal there).
preflight:
  repo: { host: github.com, path: acme/shop }
  base: main
  head: feature/ABC-1
  requirement_path: /tmp/artifacts/requirement.md
  has_followup: false
  pr_number: 7
control: { round: 1, implement: true, pr_number: 7, has_pr: true, work_order: /tmp/artifacts/work-order.md }
implement: { summary: "stub: implemented", commits: 1, threads: [] }
checkstyle: { ok: true, style_ok: true, verify_ok: true, log_path: /tmp/artifacts/checkstyle.log, verify_log_path: "" }
publish:
  pr: { number: 7, url: "https://github.com/acme/shop/pull/7", is_draft: true }
  pushed: true
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  answered: 0
request-review: { requested: true, head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, error: "" }
await:
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  copilot: done
  checks: green
  open_threads: 1
  red_units: 0
  conflict: false
  snapshot_path: /tmp/artifacts/snapshot.json
judge-threads:
  decisions:
    - { thread: PRRT_9, decision: needs_human, reason: "Copilot asks to return 404 instead of 400 for unknown users; the requirement is silent. Choose 400 (current) or 404.", reply: "" }
  summary: "stub: 1 needs_human"
act:
  done: false
  has_work: false
  ask: true
  reruns: 0
  summary: "1 review thread(s) need a human decision; 1 review thread(s) unresolved"
  report_path: /tmp/artifacts/escalation.md
  pr_number: 7
  pr_url: "https://github.com/acme/shop/pull/7"
escalate: { text: "Keep 400. Decline thread PRRT_9: the API contract in requirement AC-4 fixes 400 for unknown users." }
summarize: { summary: "stub" }
finish: { done: false, pr_url: "https://github.com/acme/shop/pull/7", reason: "the round cap was reached" }
fixture:
  expect: completed
  authored: failed
  inputs: { key: ABC-1 }
  reached: [judge-threads, act, escalate, finish]
  resolved-text-contains:
    escalate: "Details and how to answer: /tmp/artifacts/escalation.md"
