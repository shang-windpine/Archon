# A round with two open Copilot threads: judge-threads accepts one and declines the
# other. act replies to and resolves the declined one and leaves the accepted one as
# next round's work: has_work, not done, nothing to ask, so escalate is skipped.
# (A dry run treats the loop as complete after one round; threads-fixed.stubs.yaml is
# the following round.) judge-ci and escalate have no stub: they must be skipped.
preflight:
  repo: { host: github.com, path: acme/shop }
  base: main
  head: feature/ABC-1
  requirement_path: /tmp/artifacts/requirement.md
  has_followup: false
  pr_number: 7
control: { round: 1, implement: true, pr_number: 7, has_pr: true, work_order: /tmp/artifacts/work-order.md }
implement: { summary: "stub: implemented", commits: 1, threads: [] }
checkstyle: { ok: true, style_ok: true, verify_ok: true, log_path: /tmp/artifacts/checkstyle.log, verify_log_path: "" }
publish:
  pr: { number: 7, url: "https://github.com/acme/shop/pull/7", is_draft: true }
  pushed: true
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  answered: 0
  verify_ok: true
  verify_log_path: ""
request-review: { requested: true, head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, error: "" }
await:
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  copilot: done
  checks: green
  open_threads: 2
  red_units: 0
  conflict: false
  snapshot_path: /tmp/artifacts/snapshot.json
judge-threads:
  decisions:
    - { thread: PRRT_1, decision: accept, reason: "Null name reaches greet(); reject it in GreetController.greet and add a test.", reply: "" }
    - { thread: PRRT_2, decision: decline, reason: "already covered", reply: "Blank names are rejected before this call (GreetController.java:21); GreetControllerTest.rejectsBlank covers it." }
  summary: "stub: 1 accept, 1 decline"
act:
  done: false
  has_work: true
  ask: false
  reruns: 0
  summary: "1 review thread(s) accepted for fixing; 1 review thread(s) unresolved; declined and resolved 1 thread(s)"
  report_path: ""
  pr_number: 7
  pr_url: "https://github.com/acme/shop/pull/7"
summarize: { summary: "stub" }
finish: { done: false, pr_url: "https://github.com/acme/shop/pull/7", reason: "the round cap was reached" }
fixture:
  expect: completed
  authored: failed
  inputs: { key: ABC-1 }
  reached: [control, implement, checkstyle, publish, request-review, await, judge-threads, act, finish]
