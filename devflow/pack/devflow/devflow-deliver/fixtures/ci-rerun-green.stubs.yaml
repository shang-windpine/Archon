# The round after ci-infra-rerun: no work and no answer, so implement, fix-style and
# pr-text are skipped; checkstyle still gates the unchanged head, publish pushes
# nothing new, request-review skips the head it already requested, and await sees the
# rerun green: done.
preflight:
  repo: { host: github.com, path: acme/shop }
  base: main
  head: feature/ABC-1
  requirement_path: /tmp/artifacts/requirement.md
  has_followup: false
  pr_number: 7
control: { round: 2, implement: false, pr_number: 7, has_pr: true, work_order: /tmp/artifacts/work-order.md }
checkstyle: { ok: true, style_ok: true, verify_ok: true, log_path: /tmp/artifacts/checkstyle.log, verify_log_path: "" }
publish:
  pr: { number: 7, url: "https://github.com/acme/shop/pull/7", is_draft: true }
  pushed: false
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  answered: 0
  verify_ok: true
  verify_log_path: ""
request-review: { requested: false, head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, error: "" }
await:
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  copilot: done
  checks: green
  open_threads: 0
  red_units: 0
  conflict: false
  snapshot_path: /tmp/artifacts/snapshot.json
act:
  done: true
  has_work: false
  ask: false
  reruns: 0
  summary: "done: checks green, Copilot settled, no open thread"
  report_path: ""
  pr_number: 7
  pr_url: "https://github.com/acme/shop/pull/7"
summarize: { summary: "stub" }
finish: { done: true, pr_url: "https://github.com/acme/shop/pull/7", reason: done }
fixture:
  expect: completed
  authored: succeeded
  inputs: { key: ABC-1 }
  reached: [control, checkstyle, publish, request-review, await, act, summarize, finish]
