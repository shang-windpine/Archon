# Checkstyle passes but local_verify_cmd fails: fix-style is skipped, publish pushes
# anyway and reports verify_ok false, and act hands the failure to the next round and
# asks (escalate is reached) instead of the run dying at publish. fix-style has no
# stub, so the fixture fails if it is reached.
preflight:
  repo: { host: github.com, path: acme/shop }
  base: main
  head: feature/ABC-1
  requirement_path: /tmp/artifacts/requirement.md
  has_followup: false
  pr_number: 7
control: { round: 1, implement: true, pr_number: 7, has_pr: true, work_order: /tmp/artifacts/work-order.md }
implement: { summary: "stub: implemented", commits: 1, threads: [] }
checkstyle: { ok: false, style_ok: true, verify_ok: false, log_path: /tmp/artifacts/checkstyle.log, verify_log_path: /tmp/artifacts/local-verify.log }
publish:
  pr: { number: 7, url: "https://github.com/acme/shop/pull/7", is_draft: true }
  pushed: true
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  answered: 0
  verify_ok: false
  verify_log_path: /tmp/artifacts/local-verify-final.log
request-review: { requested: true, head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, error: "" }
await:
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  copilot: done
  checks: green
  open_threads: 0
  red_units: 0
  conflict: false
  snapshot_path: /tmp/artifacts/snapshot.json
act:
  done: false
  has_work: true
  ask: true
  reruns: 0
  summary: "needs you: local_verify_cmd failed on the pushed head; the next round fixes it. If the failure is environmental, an answer cannot end it (the frozen command fails every round): abandon and start a new run with a working local_verify_cmd; status: local_verify_cmd failed on the pushed head"
  report_path: /tmp/artifacts/escalation.md
  pr_number: 7
  pr_url: "https://github.com/acme/shop/pull/7"
escalate: { decision: continue, text: "" }
summarize: { summary: "stub" }
finish: { done: false, pr_url: "https://github.com/acme/shop/pull/7", reason: "the round cap was reached" }
fixture:
  expect: completed
  authored: failed
  inputs: { key: ABC-1 }
  reached: [checkstyle, publish, act, escalate, finish]
