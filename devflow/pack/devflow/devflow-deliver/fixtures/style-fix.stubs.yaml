# Checkstyle fails after implement: the fix-style loop runs before publish (which
# re-checks and would refuse if it were still red).
preflight:
  repo: { host: github.com, path: acme/shop }
  base: main
  head: feature/ABC-1
  requirement_path: /tmp/artifacts/requirement.md
  has_followup: false
  pr_number: 7
control: { round: 1, implement: true, pr_number: 7, has_pr: true, work_order: /tmp/artifacts/work-order.md }
implement: { summary: "stub: implemented", commits: 1, threads: [] }
checkstyle: { ok: false, style_ok: false, verify_ok: true, log_path: /tmp/artifacts/checkstyle.log, verify_log_path: "" }
fix-style: "stub: fixed 3 violations and committed"
publish:
  pr: { number: 7, url: "https://github.com/acme/shop/pull/7", is_draft: true }
  pushed: true
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  answered: 0
  verify_ok: true
  verify_log_path: ""
request-review: { requested: true, head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, error: "" }
await:
  head_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  copilot: done
  checks: green
  open_threads: 0
  red_units: 0
  conflict: false
  snapshot_path: /tmp/artifacts/snapshot.json
act:
  done: true
  has_work: false
  ask: false
  reruns: 0
  summary: "done"
  report_path: ""
  pr_number: 7
  pr_url: "https://github.com/acme/shop/pull/7"
summarize: { summary: "stub" }
finish: { done: true, pr_url: "https://github.com/acme/shop/pull/7", reason: done }
fixture:
  expect: completed
  authored: succeeded
  inputs: { key: ABC-1 }
  reached: [checkstyle, fix-style, publish, act, finish]
