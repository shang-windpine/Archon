# <repo>/.archon/packs/devflow.yaml — this repository's devflow pack settings.
# Written by devflow/scripts/install.sh when absent. Only `settings:` is allowed at the
# top level, and only the names below: an unknown name or a bad enum value refuses the
# run at start. Every value is text; a list is comma-separated with no empty items.
# One run can override any setting with `--input name=value`.
#
# Command templates: `{token}` is replaced by a shell-quoted value before the POSIX shell
# (`sh`; Git Bash on Windows) runs the command, so never put a token inside quotes. Credentials never go here (this file
# is copied into worktrees): tools use their own login, or ~/.archon/.env.
settings:
  # Prints one Jira issue for devflow-refine. {key} is the KEY (for example ABC-123).
  # The default needs jira-cli (`jira init` once). Empty: refine never fetches Jira and
  # works only from inbox/*.md, brief_file and the run message.
  jira_view_cmd: "jira issue view {key} --plain --comments 30"

  # Posts the final requirement as a Jira comment. {key} is the KEY, {file} the path of
  # the comment body. Empty (default): devflow never writes to Jira.
  # Example: "jira issue comment add {key} --template {file} --no-input"
  jira_comment_cmd: ""

  # Local checkstyle; exit code 0 means clean. devflow-deliver runs it before every
  # push, asks an agent to fix violations, and refuses to push while it still fails.
  checkstyle_cmd: "__MVN__ -B -q checkstyle:check"

  # An extra fast local check before every push, such as one module's unit tests.
  # Empty (default) skips it. Example: "__MVN__ -B -q -pl core -am test"
  local_verify_cmd: ""

  # request: after every push devflow asks Copilot to review (copilot_request_cmd).
  # auto:    a repository ruleset requests Copilot reviews; devflow only waits.
  # off:     devflow does not wait for Copilot at all.
  copilot_mode: request

  # How a review is requested in request mode. {number} is the PR number, {repo} is
  # what `gh --repo` takes (owner/name on github.com, host/owner/name elsewhere), {host}
  # the host and {path} owner/name. `--add-reviewer @copilot` needs gh >= 2.88 and is not
  # available on GitHub Enterprise Server.
  copilot_request_cmd: "gh pr edit {number} --repo {repo} --add-reviewer @copilot"

  # Confirms a request took effect. It runs before and after the request and prints the
  # requested reviewer of every review request recorded on the PR, one login per line
  # (same tokens as above); the request counts when the Copilot lines grow, or Copilot
  # already reviewed the head. gh can exit 0 without recording a request when the account
  # lacks Copilot code review or the repository or organization does not allow it; then
  # no review comes, so devflow asks a person at once instead of waiting
  # copilot_wait_min. The PR's requested_reviewers list is no evidence: GitHub never
  # lists Copilot there, even while its review is pending. If this command itself fails,
  # the request counts as made. Empty: no confirmation.
  copilot_confirm_cmd: "gh api --hostname {host} --paginate repos/{path}/issues/{number}/events --jq '.[] | select(.event == \"review_requested\") | .requested_reviewer.login // empty'"

  # Logins that identify Copilot as a review author (case-insensitive exact match).
  copilot_logins: "copilot-pull-request-reviewer,copilot-pull-request-reviewer[bot],copilot,Copilot"

  # Seconds between polls of the PR's reviews and checks.
  poll_interval_sec: "60"

  # Minutes to wait for Copilot to review the current head before asking a person.
  copilot_wait_min: "30"

  # Minutes to wait for CI on the current head to settle before asking a person.
  ci_wait_min: "90"

  # Check names that must be present and green (exact names as GitHub shows them,
  # comma-separated). Empty (default): the forge's overall check summary must be green.
  # Example: "build,unit-tests"
  required_checks: ""

  # Check names that may conclude "skipped" (exact names, comma-separated). GitHub
  # counts a skipped check as passing, but devflow's pull request stays a draft, and a
  # job guarded by `if: !github.event.pull_request.draft` is skipped on every draft: CI
  # never ran. So any other skipped check blocks done and devflow asks you; a name in
  # required_checks must really pass even when listed here. Empty (default): no check
  # may be skipped. Example: "deploy-preview,release-notes"
  allow_skipped_checks: ""

  # When devflow-refine asks a person between review rounds.
  # auto: when the reviewer needs a person or approves. always: every round.
  # never: only when the reviewer approves (finalizing always takes a person).
  refine_human: auto

  # Free text for agents: which paths or modules are the UI side, and which are the
  # External API side. Used to classify a change and plan local tests.
  # Example ui_hint: "web/ (React app), src/main/resources/templates/"
  # Example api_hint: "api/src/main/java/**/controller/, openapi/*.yaml"
  ui_hint: ""
  api_hint: ""

  # Repository path of the guidance file agents should read first (for example
  # AGENTS.md). Empty (default): agents discover the project's guidance themselves.
  project_notes: ""
